name: Weekly vacancy check

# Запуск: каждый понедельник в 06:12 UTC (09:12 по Москве), вручную по кнопке,
# и на push в main (кроме коммитов с данными — чтобы не зациклиться).
on:
  schedule:
    - cron: "12 6 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "run.log"

# Нужно право коммитить обновлённый CSV/seen обратно в репозиторий.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: Commit updated data
        continue-on-error: true
        run: |
          git config user.name "vacancy-bot"
          git config user.email "vacancy-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Изменений в data/ нет."
          else
            git commit -m "chore: обновление вакансий $(date -u +%Y-%m-%d)"
            # На случай гонки/расхождения — подтянуть свежее и повторить push.
            git pull --rebase origin main || true
            git push || (sleep 5 && git pull --rebase origin main && git push) || echo "Push не удался — данные останутся в артефакте прогона."
          fi
